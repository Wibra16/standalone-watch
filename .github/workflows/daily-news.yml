# Once a day after the Jakarta market close (16:00 WIB = 09:00 UTC), and twice more
# during the day, refresh all the data the website shows and commit it.
# Cloudflare Pages (and Streamlit Cloud) redeploy automatically on each commit.
name: Daily data update

on:
  schedule:
    - cron: "30 9 * * *"      # 09:30 UTC daily, after the Jakarta close
    - cron: "0 0,3,6,21 * * *" # news + Reddit through the day; 21:00 UTC is after the US close (EIDO)
  workflow_dispatch:           # run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python update_data.py          # fundamentals snapshot
      - run: python export_site_data.py     # prices, news, Argentina, Reddit -> site/data/*.json
      - name: Commit if anything changed
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/news.csv data/fundamentals.csv site/data
          git diff --cached --quiet || (git commit -m "Daily data update" && git push)
